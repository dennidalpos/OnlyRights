name: ci

on:
  push:
    branches:
      - main
      - master
      - "codex/**"
  pull_request:

jobs:
  build-test-pack-publish:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Clean (initial)
        run: powershell -File .\scripts\clean.ps1

      - name: Bootstrap
        run: powershell -File .\scripts\bootstrap.ps1

      - name: Doctor
        run: powershell -File .\scripts\doctor.ps1

      - name: Build
        run: powershell -File .\scripts\build.ps1 -Configuration Release -SkipRestore

      - name: Test
        run: powershell -File .\scripts\test.ps1 -Configuration Release -SkipRestore -SkipBuild

      - name: Pack
        run: powershell -File .\scripts\pack.ps1 -Configuration Release -SkipRestore -SkipBuild

      - name: Publish
        run: powershell -File .\scripts\publish.ps1 -Configuration Release

      - name: Build net6 App and Viewer
        run: powershell -File .\scripts\build.ps1 -Configuration Release -Framework net6.0-windows -SkipRestore

      - name: Pack net6 App and Viewer
        run: powershell -File .\scripts\pack.ps1 -Configuration Release -Framework net6.0-windows -SkipRestore -SkipService

      - name: Publish net6 App and Viewer
        run: powershell -File .\scripts\publish.ps1 -Configuration Release -Framework net6.0-windows

      - name: MSI Build
        run: powershell -File .\scripts\packaging\msi-build.ps1 -Configuration Release -SkipPack

      - name: Service Install Smoke
        run: powershell -File .\scripts\windows\service-install.ps1 -Configuration Release

      - name: Service Uninstall Smoke
        if: always()
        run: powershell -File .\scripts\windows\service-uninstall.ps1

      - name: MSI Install Smoke
        run: powershell -File .\scripts\packaging\msi-install-test.ps1 -Configuration Release -InstallRoot artifacts\publish\msi-smoke\basic -SkipBuild

      - name: MSI Uninstall Smoke
        run: powershell -File .\scripts\packaging\msi-uninstall-test.ps1 -Configuration Release -InstallRoot artifacts\publish\msi-smoke\basic

      - name: MSI Upgrade Smoke
        run: powershell -File .\scripts\packaging\msi-upgrade-test.ps1 -Configuration Release -InstallRoot artifacts\publish\msi-smoke\upgrade

      - name: Clean (final)
        if: always()
        run: powershell -File .\scripts\clean.ps1
