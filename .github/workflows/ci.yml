name: ci

on:
  push:
    branches:
      - main
      - master
      - "codex/**"
  pull_request:

jobs:
  build-test:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Restore
        run: dotnet restore .\NtfsAudit.sln --nologo

      - name: Build
        run: dotnet build .\NtfsAudit.sln -c Release --no-restore --nologo

      - name: Test
        run: dotnet test .\NtfsAudit.sln -c Release --no-build --nologo --results-directory .\artifacts\test-results
