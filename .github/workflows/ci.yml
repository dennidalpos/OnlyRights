name: ci

on:
  push:
    branches:
      - main
      - master
      - "codex/**"
  pull_request:

jobs:
  build-test:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Bootstrap
        run: powershell -File .\scripts\bootstrap.ps1

      - name: Build
        run: powershell -File .\scripts\build.ps1 -Configuration Release -SkipRestore

      - name: Test
        run: powershell -File .\scripts\test.ps1 -Configuration Release -SkipRestore -SkipBuild
